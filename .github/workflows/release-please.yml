name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions: {}

jobs:
  release-please:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the app credentials
        env:
          APP_ID: ${{ vars.RELEASE_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::RELEASE_BOT_APP_ID or RELEASE_BOT_PRIVATE_KEY isn't available to this event"
            exit 1
          fi
      - name: Create app token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Decide whether the release PR may merge
        env:
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          pr="$(gh pr list --label 'autorelease: pending' --state open --json number,title,autoMergeRequest --jq '.[0] // empty')"
          if [ -z "$pr" ]; then
            echo "::notice::No open release PR"
            exit 0
          fi
          number="$(jq -r '.number' <<< "$pr")"
          title="$(jq -r '.title' <<< "$pr")"
          armed="$(jq -r '.autoMergeRequest != null' <<< "$pr")"

          title_re='^chore\(main\): release ([0-9]+)\.[0-9]+\.[0-9]+$'
          title_major=
          if [[ "$title" =~ $title_re ]]; then
            title_major="${BASH_REMATCH[1]}"
          fi

          # A failed read must reach the hold branch, not abort the step.
          current="$(gh api "repos/$GH_REPO/contents/.release-please-manifest.json?ref=main" --jq .content | base64 -d | jq -r '."."' || true)"
          manifest_major=
          if [[ "$current" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            manifest_major="${BASH_REMATCH[1]}"
          fi

          hold=
          if [ "$AUTO_RELEASE" != on ]; then
            hold="AUTO_RELEASE isn't set to on"
          elif [ -z "$title_major" ]; then
            hold="the title '$title' isn't a release title"
          elif [ -z "$manifest_major" ]; then
            hold="the version in the manifest on main couldn't be read"
          elif [ "$title_major" != "$manifest_major" ]; then
            hold="the release changes the major version from $manifest_major to $title_major"
          fi

          if [ -z "$hold" ]; then
            if [ "$armed" = true ]; then
              echo "::notice::PR #$number already has auto-merge on"
            else
              gh pr merge --auto --squash "$number"
              echo "::notice::Turned on auto-merge for PR #$number"
            fi
            exit 0
          fi

          echo "::notice::PR #$number is held: $hold"
          if [ "$armed" = true ]; then
            gh pr merge --disable-auto "$number"
          fi
