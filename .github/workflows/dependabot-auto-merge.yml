name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      vulnerability-alerts: read
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Check for a Go module security fix at patch or minor level
        id: check
        if: >-
          steps.metadata.outputs.package-ecosystem == 'go_modules' &&
          (steps.metadata.outputs.dependency-group == 'go-security' ||
          steps.metadata.outputs.dependency-group == '')
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          # Dependabot can open a lone security update outside its group, so an ungrouped PR needs an open alert.
          alerts="$RUNNER_TEMP/alerts.json"
          echo '[]' > "$alerts"
          if [ -z "$GROUP" ]; then
            gh api "repos/$GITHUB_REPOSITORY/dependabot/alerts?state=open&ecosystem=go&per_page=100" > "$alerts"
          fi
          eligible="$(jq --arg group "$GROUP" --argjson updates "$UPDATES" '
            def release: test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$");
            def parts: ltrimstr("v") | split(".") | map(tonumber);
            def fixed_by($update):
              (.security_vulnerability.first_patched_version.identifier // "") as $patched
              | .dependency.package.name as $name
              | ($name == $update.dependencyName or ($name | startswith($update.dependencyName + "/")))
                and ($patched | release)
                and (($patched | parts) <= ($update.newVersion | parts));
            . as $alerts
            | ($updates | length > 0) and all($updates[];
              . as $update
              | (.updateType | IN("version-update:semver-patch", "version-update:semver-minor"))
                and (.prevVersion | release)
                and (.newVersion | release)
                and ($group != "" or any($alerts[]; fixed_by($update))))
          ' "$alerts")"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge
        if: steps.check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
