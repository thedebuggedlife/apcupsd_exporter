version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
      go-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor]
      go-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
      actions-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
      docker-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor]
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
